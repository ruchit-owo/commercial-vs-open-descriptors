[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "descbench"
version = "0.1.0"
description = "A fair, leak-free comparison of commercial (alvaDesc) and open molecular descriptors"
requires-python = ">=3.11"
# Exact versions are pinned in requirements.txt; the ranges here are the minimums
# the code was written against.
dependencies = [
    "numpy>=2.1",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "rdkit>=2024.9",
    "pyarrow>=15",
    "pyyaml>=6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Mordred (via the maintained community fork) and XGBoost are optional; the study
# runs without them, recording their absence as a practical cost.
extras = ["mordredcommunity>=2.0", "xgboost>=2.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scikit-learn and its dependencies emit deprecation warnings we do not act on
# here; silence them so a failing assertion is not lost in the noise.
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
